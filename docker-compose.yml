# 一行部署 Agent Harness：
#
#   docker compose up -d          建置並啟動
#   docker compose logs harness   看網址與管理者 admin 自動產生的密碼
#
# 不需要任何設定就能啟動。要調整的話，把 .env.example 複製成 .env 再修改
# （埠號、登入密碼、proxy、模型金鑰）。說明見文件網站的「快速部署」（https://agent-harness-docs-ten.vercel.app/guide/deploy）。

name: harness

# 建置映像檔時（pip、apt）使用的 proxy；沒有設定時是空的，等於不使用。
x-proxy-args: &proxy-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  NO_PROXY: ${NO_PROXY:-}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  no_proxy: ${NO_PROXY:-}

services:
  harness:
    build:
      context: .
      args: *proxy-args
    image: agent-harness
    restart: unless-stopped
    ports:
      - "${HARNESS_PORT:-4321}:4321"
    # .env 裡的其他設定（模型金鑰、HARNESS_WEB_PASSWORD…）原樣交給容器。
    # 前面再加一層 HTTPS 反向代理時，在 .env 寫上它連進容器的位址，例如
    # HARNESS_TRUSTED_PROXIES=172.16.0.0/12：只有來自這些位址的請求才採信
    # X-Forwarded-For（登入限制依它計算）與 X-Forwarded-Proto（cookie 的 Secure）。
    env_file:
      - path: .env
        required: false
    environment:
      # 執行時（呼叫模型、讀取網頁）使用的 proxy，大小寫兩種寫法都設定。
      <<: *proxy-args
      # 時區：知識庫依它判斷文件「今天」是否已經生效或失效（在 .env 改 TZ）。
      TZ: ${TZ:-Asia/Taipei}
      # 沙盒：agent 寫的程式與執行的指令（管理者也一樣）在另一個容器裡執行，
      # 只看得到 harness-data 裡這段對話的工作資料夾（private/<識別碼>/ 或
      # 管理者開放的共用資料夾）。容器由下面的 sandbox-runner 啟動，平台
      # 本身碰不到 Docker。
      HARNESS_SANDBOX_RUNNER: http://sandbox-runner:4322
      HARNESS_SANDBOX_TOKEN_FILE: /run/harness-runner/token
      HARNESS_SANDBOX_VOLUME: harness-data
      HARNESS_SANDBOX_NOTES: >-
        已安裝 pandas、numpy、openpyxl、pdfplumber、pypdf、reportlab、
        python-docx、python-pptx、markitdown、matplotlib（圖表可以直接使用
        中文）、LibreOffice（soffice --headless --convert-to pdf 檔名，可以把
        Word、PowerPoint 轉成 PDF）、pandoc、qpdf、poppler-utils、tesseract
        （OCR，含繁中 chi_tra），以及 Node.js 與 pptxgenjs、docx、pdf-lib
        （node 腳本直接 require，不用安裝）。要執行 shell 指令時在程式裡用
        subprocess。處理 Excel、Word、PowerPoint、PDF 檔之前，先用 load_skill
        載入對應的 xlsx、docx、pptx、pdf 技能（有的話），它們的腳本在
        /opt/skills/。另外裝好 Playwright 與無頭 Chromium（只能開沙盒裡的
        網頁）、Python mcp 與 Node 的 MCP SDK、typescript（tsc），以及
        web-artifacts-builder 的 React 專案範本（/opt/web-artifact）。沙盒
        沒有網路，不能 pip install 或 npm install。
    volumes:
      # 專案、帳號、每個人的對話紀錄、上傳的檔案與金鑰都在這個 volume 裡。
      - harness-data:/assistant
      # 沙盒服務每次啟動產生的通行碼（唯讀）。
      - sandbox-token:/run/harness-runner:ro
    networks:
      - default
      - sandbox
    depends_on:
      - sandbox-runner

  # 沙盒服務：唯一掛載 Docker socket 的容器。能使用 socket 等於擁有主機的
  # root 權限，所以只交給這個只做一件事的服務：它只接受「在沙盒裡執行
  # 這段程式」，映像檔、使用者、資源上限與網路都照下面的設定，只能掛載
  # harness-data 裡的工作資料夾。它只在內部網路 sandbox 上，連不到外面，
  # 也沒有開放埠號給主機。不需要沙盒（分析上傳的檔案）時，把這個服務和
  # 上面的 HARNESS_SANDBOX_RUNNER 一起刪掉。
  sandbox-runner:
    image: agent-harness
    restart: unless-stopped
    command: ["pyharness", "sandbox-runner"]
    environment:
      HARNESS_SANDBOX_IMAGE: harness-sandbox
      HARNESS_SANDBOX_VOLUME: harness-data
      HARNESS_SANDBOX_TOKEN_FILE: /run/harness-runner/token
      # 主機裝了 gVisor 時，改成 runsc 讓沙盒多一層核心隔離（見文件
      # 「快速部署」的「沙盒」）。
      HARNESS_SANDBOX_RUNTIME: ${HARNESS_SANDBOX_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandbox-token:/run/harness-runner
    networks:
      - sandbox

  # 只用來建置沙盒的映像檔，本身不會持續執行。
  sandbox-image:
    build:
      # 建置目錄是 repo 根目錄：內建 skills 的腳本（python/src/harness/
      # builtin/skills）要一併裝進映像檔的 /opt/skills。
      context: .
      dockerfile: docker/sandbox.Dockerfile
      args: *proxy-args
    image: harness-sandbox
    command: ["true"]
    restart: "no"
    network_mode: none

networks:
  # 平台與沙盒服務之間的內部網路，不能連到外面。
  sandbox:
    internal: true

volumes:
  harness-data:
    # 固定名稱：沙盒要用這個名稱掛載工作資料夾。
    name: harness-data
  sandbox-token:
